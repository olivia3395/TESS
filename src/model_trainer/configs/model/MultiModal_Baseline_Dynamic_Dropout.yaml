
# MultiModal Baseline with Dynamic Dropout
# 基于原始MultiModal_Baseline，添加动态dropout机制
# 支持token级别文本输入，学习性dropout重要token

# learning_rate: [0.005]
learning_rate: [0.001,0.005,0.01]

requires_news_embedding: true

# embedding_size: 512
embedding_size: [256,512,1024]

# depth: [5, 10, 15]
depth: 10
num_envs: 10
# num_envs: [10]
dropout: [0.1, 0.2, 0.3]
# dropout: 0.1
meta_drop: 0.1
# sudden_drop: 0.1
sudden_drop: [0.1, 0.2, 0.3]
# fuse_drop: 0.1
fuse_drop: [0.1, 0.2, 0.3]

e_layers: 1
d_layers: 1
factor: 3
enc_in: 1
dec_in: 1
c_out: 1
embedd: timeF
use_multimodal: True
inverse: False
text_emb_dim: 4096

# Loss weights for dynamic dropout
beta1: 0.2
beta2: 0.2
beta3: 0.1   # word embedding loss weight - 监督dropout后的embeddings接近理想embeddings
beta4: 0.05  # reconstruction loss weight (reserved for future use)

num_workers: 2
# Hyperparameter search space
hyper_parameters: ["learning_rate","embedding_size","dropout","sudden_drop","fuse_drop"]
